name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.0.2 (tag v<version> is created)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Resolve version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Build plugin
        run: ./gradlew buildPlugin -PpluginVersion="$VERSION"

      - name: Publish to GitHub Packages
        run: ./gradlew publish -PpluginVersion="$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          gh release create "v$VERSION" build/distributions/*.zip \
            --title "v$VERSION" --generate-notes --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
